            disabled200RenderMs.push(measure(false));

    texture.needsUpdate = true;

    field.rebuild({ lamps, walls });
    texture.needsUpdate = true;
    renderer.render(scene, camera);
    const texturesAfter20 = renderer.info.memory.textures;
    const programsAfter20 = renderer.info.programs.length;
    const comparisonLamp = { id: 'comparison', level: 0, x: 3, y: 2,

    const pointLight = new THREE.PointLight(comparisonLamp.color,

    scene.add(pointLight);
    const wallCamera = camera.clone();
    wallCamera.position.set(2, 7, 3);
    wallCamera.lookAt(6, 1.4, 3);
    const readSurface = (activeCamera, positions) => {
        renderer.render(scene, activeCamera);
        const gl = renderer.getContext();
        return positions.map(position => {
            const projected = position.clone().project(activeCamera);
            const pixel = new Uint8Array(4);
            gl.readPixels(Math.floor((projected.x + 1) * 320),
                Math.floor((projected.y + 1) * 180), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
            return [...pixel];
        });
    };
    const floorProbes = [3, 3.5, 4, 4.5].map(x => new THREE.Vector3(x, 0, 3));

    controls.forEach(control => { control.enabled.value = 0; });
    pointLight.intensity = 0;
    const comparisonAmbient = measureSurfaces();
    pointLight.intensity = comparisonLamp.intensity;
    const comparisonDynamic = measureSurfaces();
    pointLight.intensity = 0;
    controls.forEach(control => { control.enabled.value = 1; });
    const comparisonField = measureSurfaces();
    const comparisonMaxRgbDelta = Math.max(...['floor', 'wall'].flatMap(surface =>

        before, after, build8, build20,

} catch (error) {
    document.querySelector('#result').textContent = JSON.stringify({ ok: false,
        errors: [...errors, String(error), error.stack] });
}
</script>
