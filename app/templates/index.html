<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Периметр</title>
    <link rel="icon" type="image/png" href="/static/assets/pictures/bg.png">
    <style>
        :root {
            --panel-bg: rgba(9, 12, 10, 0.86);
            --panel-border: rgba(184, 164, 110, 0.16);
            --text-main: #f0eadc;
            --text-muted: rgba(240, 234, 220, 0.72);
            --accent: #a18a4b;
            --accent-soft: rgba(161, 138, 75, 0.18);
            --danger: #a95d4b;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            background:
                radial-gradient(circle at top left, rgba(145, 114, 52, 0.05), transparent 30%),
                radial-gradient(circle at bottom right, rgba(26, 51, 42, 0.14), transparent 28%),
                linear-gradient(180deg, rgba(5, 7, 6, 0.22) 0%, rgba(5, 7, 6, 0.42) 100%),
                url("/static/assets/pictures/bg.png") center center / cover no-repeat fixed,
                #070a08;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center, transparent 58%, rgba(0, 0, 0, 0.14) 100%);
            mix-blend-mode: multiply;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(20px, 4vw, 56px);
            position: relative;
            z-index: 1;
        }

        .shell {
            width: min(560px, 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .brand {
            margin-bottom: 0;
            text-align: left;
        }
        .brand h1 {
            margin: 0;
            font-size: clamp(30px, 3.5vw, 48px);
            letter-spacing: 0.05em;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.55);
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(18, 22, 18, 0.82), rgba(9, 12, 10, 0.88)),
                var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 28px 72px rgba(0, 0, 0, 0.46);
            backdrop-filter: blur(16px);
        }

        .stack { display: flex; flex-direction: column; gap: 8px; }
        .section-title {
            margin: 0 0 6px;
            font-size: 17px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #e8ddc7;
            font-weight: 700;
        }
        .section-block + .section-block {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(184, 164, 110, 0.12);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(184, 164, 110, 0.14);
            background: rgba(5, 8, 6, 0.58);
            color: var(--text-main);
            outline: none;
        }

        input::placeholder { color: rgba(240, 234, 220, 0.42); }
        input:focus, textarea:focus, select:focus {
            border-color: rgba(161, 138, 75, 0.6);
            box-shadow: 0 0 0 3px rgba(161, 138, 75, 0.16);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            padding: 11px 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: #11140e;
            background: linear-gradient(180deg, #9aa06b 0%, #6d7544 100%);
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.05); }
        button:active { transform: translateY(0); }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-start;
        }

        .error {
            color: #ffb7a6;
            margin-top: 6px;
            min-height: 1.25em;
        }

        .success { color: #c8e8b0; margin-top: 6px; }
        .hidden { display: none; }
        #auth-section, #app-section { text-align: left; }
        #auth-section button,
        #app-section button { align-self: flex-start; }
        #app-section > .section-block:first-child {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        #app-section > .section-block:first-child .section-title {
            margin: 0;
            text-transform: none;
            letter-spacing: 0.01em;
            font-size: 16px;
        }
        #app-section > .section-block:first-child .button-row {
            margin-top: 0;
            flex-shrink: 0;
        }
        #app-section > .section-block:first-child .button-row button {
            white-space: nowrap;
        }

        #characters-list { list-style: none; padding: 0; }
        #characters-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            padding: 9px 10px;
            border-radius: 12px;
            border: 1px solid rgba(184, 164, 110, 0.1);
        }

        .lobby-item {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(184, 164, 110, 0.1);
        }

        .lobby-item button { padding: 8px 14px; }
        .delete-btn {
            background: linear-gradient(180deg, #c2775f 0%, #8d4333 100%);
            color: white;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }

        @media (max-width: 720px) {
            .page {
                align-items: flex-start;
                padding: 18px;
            }
            .panel {
                padding: 14px;
                border-radius: 18px;
            }
            .brand h1 {
                letter-spacing: 0.06em;
            }
            #app-section > .section-block:first-child {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="shell">
            <div class="brand">
                <h1>Периметр</h1>
            </div>

            <div class="panel">
                <div id="auth-section" class="stack">
                    <div class="section-block">
                        <h2 class="section-title">Регистрация</h2>
                        <div class="form-group">
                            <label for="reg-username">Имя пользователя</label>
                            <input type="text" id="reg-username">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email">
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Пароль</label>
                            <input type="password" id="reg-password">
                        </div>
                        <div class="button-row">
                            <button onclick="register()">Зарегистрироваться</button>
                        </div>
                    </div>

                    <div class="section-block">
                        <h2 class="section-title">Вход</h2>
                        <div class="form-group">
                            <label for="login-username">Имя пользователя</label>
                            <input type="text" id="login-username">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Пароль</label>
                            <input type="password" id="login-password">
                        </div>
                        <div class="button-row">
                            <button onclick="login()">Войти</button>
                        </div>
                    </div>

                    <div id="auth-message" class="error"></div>
                </div>

                <div id="app-section" class="hidden stack">
                    <div class="section-block">
                        <h2 class="section-title">Добро пожаловать, <span id="username"></span>!</h2>
                        <div class="button-row">
                            <button onclick="logout()">Выйти</button>
                        </div>
                    </div>

                    <div class="section-block">
                        <h3>Создать комнату</h3>
                        <div class="form-group">
                            <label for="lobby-name">Название комнаты</label>
                            <input type="text" id="lobby-name">
                        </div>
                        <div class="form-group">
                            <label for="map-type">Тип карты</label>
                            <select id="map-type">
                                <option value="empty">Пустая (вся трава)</option>
                                <option value="random">Случайное заполнение</option>
                                <option value="predefined">Готовая карта</option>
                                <option value="imported">Загрузить из файла</option>
                            </select>
                        </div>

                        <div class="form-group" id="map-size-fields">
                            <label for="chunks-width">Ширина карты (в чанках, 1 чанк = 32 тайла)</label>
                            <input type="number" id="chunks-width" min="1" max="32" value="16">
                            <label for="chunks-height">Высота карты (в чанках)</label>
                            <input type="number" id="chunks-height" min="1" max="32" value="16">
                        </div>

                        <div class="form-group" id="map-import-file" style="display:none;">
                            <label for="map-file">Файл карты (.gz)</label>
                            <input type="file" id="map-file" accept=".gz">
                        </div>

                        <div class="button-row">
                            <button onclick="createLobby()">Создать комнату</button>
                        </div>

                        <div id="loading-indicator" style="display:none; margin-top:10px;">
                            <span>Загрузка...</span>
                        </div>
                    </div>

                    <div class="section-block">
                        <h3>Мои комнаты</h3>
                        <div id="my-lobbies-list"></div>
                        <button id="load-more-my-lobbies" onclick="loadMoreMyLobbies()" style="margin-bottom: 20px;">Загрузить ещё</button>
                    </div>

                    <div class="section-block">
                        <h3>Посещённые комнаты</h3>
                        <div id="joined-lobbies-list"></div>
                        <button id="load-more-joined-lobbies" onclick="loadMoreJoinedLobbies()" style="margin-bottom: 20px;">Загрузить ещё</button>
                    </div>

                    <div class="section-block">
                        <h3>Присоединиться по коду</h3>
                        <div class="form-group">
                            <label for="invite-code">Код приглашения</label>
                            <input type="text" id="invite-code" placeholder="Например: A1B2C3">
                        </div>
                        <div class="button-row">
                            <button onclick="joinByCode()">Присоединиться</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('map-type')?.addEventListener('change', function(e) {
            const sizeFields = document.getElementById('map-size-fields');
            const importFile = document.getElementById('map-import-file');
            if (e.target.value === 'predefined') {
                sizeFields.style.display = 'none';
                importFile.style.display = 'none';
            } else if (e.target.value === 'imported') {
                sizeFields.style.display = 'none';
                importFile.style.display = 'block';
            } else {
                sizeFields.style.display = 'block';
                importFile.style.display = 'none';
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
