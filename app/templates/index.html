<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTRPG Site</title>
    <link rel="icon" type="image/png" href="/static/assets/pictures/bg.png">
    <style>
        :root {
            --panel-bg: rgba(10, 14, 20, 0.78);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-main: #f5f7fb;
            --text-muted: rgba(245, 247, 251, 0.72);
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text-main);
            background:
                linear-gradient(90deg, rgba(7, 10, 16, 0.86) 0%, rgba(7, 10, 16, 0.54) 44%, rgba(7, 10, 16, 0.18) 100%),
                url("/static/assets/pictures/bg.png") center center / cover no-repeat fixed,
                #081018;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(24px, 5vw, 72px);
        }

        .shell { width: min(540px, 100%); }
        .brand { margin-bottom: 18px; }
        .brand h1 {
            margin: 0 0 10px;
            font-size: clamp(34px, 4vw, 54px);
            letter-spacing: 0.02em;
            line-height: 1;
        }
        .brand p {
            margin: 0;
            max-width: 42ch;
            color: var(--text-muted);
            line-height: 1.45;
            font-size: 15px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(14px);
        }

        .stack { display: flex; flex-direction: column; gap: 18px; }
        .section-title { margin: 0 0 8px; font-size: 22px; }
        .section-block + .section-block {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            outline: none;
        }

        input::placeholder { color: rgba(245, 247, 251, 0.45); }
        input:focus, textarea:focus, select:focus {
            border-color: rgba(125, 211, 252, 0.55);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            padding: 11px 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: #06111a;
            background: linear-gradient(180deg, #bdeafe 0%, #67cdf5 100%);
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
            box-shadow: 0 12px 24px rgba(56, 189, 248, 0.2);
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.03); }
        button:active { transform: translateY(0); }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .error {
            color: #ffb4b4;
            margin-top: 6px;
            min-height: 1.25em;
        }

        .success { color: #b8ffca; margin-top: 6px; }
        .hidden { display: none; }
        #auth-section, #app-section { text-align: left; }
        #auth-section button,
        #app-section button { align-self: flex-start; }

        #characters-list { list-style: none; padding: 0; }
        #characters-list li {
            background: rgba(255, 255, 255, 0.06);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 12px;
        }

        .lobby-item {
            background: rgba(255, 255, 255, 0.06);
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .lobby-item button { padding: 8px 14px; }
        .delete-btn {
            background: linear-gradient(180deg, #ff8f8f 0%, #ef4444 100%);
            color: white;
            box-shadow: 0 12px 24px rgba(239, 68, 68, 0.18);
        }

        @media (max-width: 720px) {
            .page {
                align-items: flex-start;
                padding: 18px;
            }
            .panel {
                padding: 18px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="shell">
            <div class="brand">
                <h1>TTRPG Site</h1>
                <p>Вход, комнаты и подготовка к сессии на фоне вашей карты. Интерфейс теперь уходит влево, чтобы картинка работала как полноценная подложка.</p>
            </div>

            <div class="panel">
                <div id="auth-section" class="stack">
                    <div class="section-block">
                        <h2 class="section-title">Регистрация</h2>
                        <div class="form-group">
                            <label for="reg-username">Имя пользователя</label>
                            <input type="text" id="reg-username">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email">
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Пароль</label>
                            <input type="password" id="reg-password">
                        </div>
                        <div class="button-row">
                            <button onclick="register()">Зарегистрироваться</button>
                        </div>
                    </div>

                    <div class="section-block">
                        <h2 class="section-title">Вход</h2>
                        <div class="form-group">
                            <label for="login-username">Имя пользователя</label>
                            <input type="text" id="login-username">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Пароль</label>
                            <input type="password" id="login-password">
                        </div>
                        <div class="button-row">
                            <button onclick="login()">Войти</button>
                        </div>
                    </div>

                    <div id="auth-message" class="error"></div>
                </div>

                <div id="app-section" class="hidden stack">
                    <div class="section-block">
                        <h2 class="section-title">Добро пожаловать, <span id="username"></span>!</h2>
                        <div class="button-row">
                            <button onclick="logout()">Выйти</button>
                        </div>
                    </div>

                    <div class="section-block">
                        <h3>Создать комнату</h3>
                        <div class="form-group">
                            <label for="lobby-name">Название комнаты</label>
                            <input type="text" id="lobby-name">
                        </div>
                        <div class="form-group">
                            <label for="map-type">Тип карты</label>
                            <select id="map-type">
                                <option value="empty">Пустая (вся трава)</option>
                                <option value="random">Случайное заполнение</option>
                                <option value="predefined">Готовая карта</option>
                                <option value="imported">Загрузить из файла</option>
                            </select>
                        </div>

                        <div class="form-group" id="map-size-fields">
                            <label for="chunks-width">Ширина карты (в чанках, 1 чанк = 32 тайла)</label>
                            <input type="number" id="chunks-width" min="1" max="32" value="16">
                            <label for="chunks-height">Высота карты (в чанках)</label>
                            <input type="number" id="chunks-height" min="1" max="32" value="16">
                        </div>

                        <div class="form-group" id="map-import-file" style="display:none;">
                            <label for="map-file">Файл карты (.gz)</label>
                            <input type="file" id="map-file" accept=".gz">
                        </div>

                        <div class="button-row">
                            <button onclick="createLobby()">Создать комнату</button>
                        </div>

                        <div id="loading-indicator" style="display:none; margin-top:10px;">
                            <span>Загрузка...</span>
                        </div>
                    </div>

                    <div class="section-block">
                        <h3>Мои комнаты</h3>
                        <div id="my-lobbies-list"></div>
                        <button id="load-more-my-lobbies" onclick="loadMoreMyLobbies()" style="margin-bottom: 20px;">Загрузить ещё</button>
                    </div>

                    <div class="section-block">
                        <h3>Посещённые комнаты</h3>
                        <div id="joined-lobbies-list"></div>
                        <button id="load-more-joined-lobbies" onclick="loadMoreJoinedLobbies()" style="margin-bottom: 20px;">Загрузить ещё</button>
                    </div>

                    <div class="section-block">
                        <h3>Присоединиться по коду</h3>
                        <div class="form-group">
                            <label for="invite-code">Код приглашения</label>
                            <input type="text" id="invite-code" placeholder="Например: A1B2C3">
                        </div>
                        <div class="button-row">
                            <button onclick="joinByCode()">Присоединиться</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('map-type')?.addEventListener('change', function(e) {
            const sizeFields = document.getElementById('map-size-fields');
            const importFile = document.getElementById('map-import-file');
            if (e.target.value === 'predefined') {
                sizeFields.style.display = 'none';
                importFile.style.display = 'none';
            } else if (e.target.value === 'imported') {
                sizeFields.style.display = 'none';
                importFile.style.display = 'block';
            } else {
                sizeFields.style.display = 'block';
                importFile.style.display = 'none';
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
